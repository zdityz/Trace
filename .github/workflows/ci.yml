name: CI

on:
  push:
  pull_request:

jobs:
  test-and-compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Validate release metadata
        run: npm run check:metadata
      - name: Run automated tests
        run: npm test
      - name: Check Python syntax
        run: python -m py_compile tracer/tracer.py
      - name: Compile VS Code extension
        run: npm run compile
      - name: Package VS Code extension
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: npx --yes @vscode/vsce package --out trace.vsix
      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: trace-vsix
          path: trace.vsix
          if-no-files-found: error
